spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/feedback_ai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
sentiment.service.url=${SENTIMENT_SERVICE_URL:http://localhost:8000}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
server.port=${PORT:8080}
