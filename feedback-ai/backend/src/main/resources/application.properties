spring.application.name=feedback-ai

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/feedback_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port
server.port=8080

# Administrator Credentials for HTTP Basic Auth
app.security.admin.username=admin
app.security.admin.password=admin123

# React Frontend Origin
app.cors.allowed-origins=http://localhost:5173

